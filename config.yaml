# Example experiment: Kvasir-SEG source, CVC-ClinicDB target.
# Run prepare_polyp_data.py before training on real images.
seed: 42
data_dir: data/polyp_png
run_dir: runs/unet
architecture: unet
image_size: 256
input_channels: 3
base_channels: 16
batch_size: 8
num_workers: 0
learning_rate: 0.0003
weight_decay: 0.0001
epochs: 30
amp_cuda: true
augmentation: a0
